<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Player</title>
<style>
  :root{
    --bar: rgba(18,18,20,.55);
    --stroke: rgba(255,255,255,.14);
    --txt: #f4f4f5;
    --dim: rgba(244,244,245,.62);
    --accent: #fff;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    background:#0b0b0d;
    color:var(--txt);
    font:400 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }

  /* ---- the actual YouTube player: rendered, but invisible ---- */
  /* kept in-flow and on-screen (not display:none / off-screen) so browsers
     don't throttle or pause playback */
  #stage{
    position:fixed; inset:0;
    z-index:0;
    opacity:0;
    pointer-events:none;
  }
  #stage iframe{width:100%;height:100%;border:0}

  /* ---- full-bleed random image ---- */
  #art{
    position:fixed; inset:0; z-index:1;
    background:#101014 center/cover no-repeat;
    transform:scale(1.04);
    transition:opacity .6s ease, transform 8s ease-out;
    opacity:0;
  }
  #art.on{opacity:1; transform:scale(1)}
  #scrim{
    position:fixed; inset:0; z-index:2; pointer-events:none;
    background:
      radial-gradient(120% 80% at 50% 15%, transparent 30%, rgba(0,0,0,.35) 100%),
      linear-gradient(to top, rgba(0,0,0,.78) 0%, rgba(0,0,0,.25) 32%, transparent 60%);
  }

  /* ---- now playing ---- */
  #now{
    position:fixed; z-index:3;
    left:0; right:0; bottom:clamp(150px, 18vh, 210px);
    padding:0 24px;
    text-align:center;
    text-shadow:0 2px 24px rgba(0,0,0,.6);
  }
  #idx{
    font-size:11px; letter-spacing:.16em; text-transform:uppercase;
    color:var(--dim); margin-bottom:10px;
  }
  #title{
    margin:0 auto; max-width:900px;
    font-size:clamp(20px, 3.4vw, 34px); font-weight:600; letter-spacing:-.01em;
  }
  #author{margin-top:8px; font-size:14px; color:var(--dim)}

  /* ---- control bar ---- */
  #bar{
    position:fixed; z-index:4;
    left:50%; transform:translateX(-50%);
    bottom:max(22px, env(safe-area-inset-bottom));
    width:min(760px, calc(100vw - 28px));
    padding:14px 18px 16px;
    background:var(--bar);
    border:1px solid var(--stroke);
    border-radius:20px;
    backdrop-filter:blur(22px) saturate(160%);
    -webkit-backdrop-filter:blur(22px) saturate(160%);
    box-shadow:0 24px 60px rgba(0,0,0,.45);
  }

  .seekrow{display:flex; align-items:center; gap:12px}
  .t{font-variant-numeric:tabular-nums; font-size:12px; color:var(--dim); min-width:42px; text-align:center}

  input[type=range]{
    -webkit-appearance:none; appearance:none;
    width:100%; height:20px; background:transparent; cursor:pointer; margin:0;
  }
  input[type=range]::-webkit-slider-runnable-track{
    height:4px; border-radius:99px;
    background:linear-gradient(to right, var(--accent) var(--p,0%), rgba(255,255,255,.22) var(--p,0%));
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; width:13px; height:13px; margin-top:-4.5px;
    border-radius:50%; background:var(--accent);
    box-shadow:0 1px 6px rgba(0,0,0,.5);
    transition:transform .12s ease;
  }
  input[type=range]:active::-webkit-slider-thumb{transform:scale(1.25)}
  input[type=range]::-moz-range-track{height:4px;border-radius:99px;background:rgba(255,255,255,.22)}
  input[type=range]::-moz-range-progress{height:4px;border-radius:99px;background:var(--accent)}
  input[type=range]::-moz-range-thumb{width:13px;height:13px;border:0;border-radius:50%;background:var(--accent)}

  .btns{
    display:flex; align-items:center; justify-content:center; gap:6px;
    margin-top:4px;
  }
  button{
    display:grid; place-items:center;
    width:42px; height:42px; padding:0;
    border:0; border-radius:12px;
    background:transparent; color:var(--txt);
    cursor:pointer;
    transition:background .15s ease, transform .1s ease, opacity .15s ease;
  }
  button:hover{background:rgba(255,255,255,.11)}
  button:active{transform:scale(.93)}
  button:focus-visible{outline:2px solid rgba(255,255,255,.7); outline-offset:2px}
  button.on{color:#111; background:#fff}
  button[disabled]{opacity:.32; cursor:default}
  button svg{width:20px;height:20px;fill:currentColor;pointer-events:none}
  #play{width:54px;height:54px;background:#fff;color:#111;border-radius:50%;margin:0 8px}
  #play:hover{background:#fff;transform:scale(1.05)}
  #play svg{width:24px;height:24px}

  .side{
    position:absolute; bottom:18px; display:flex; align-items:center; gap:4px;
  }
  .side.l{left:14px}
  .side.r{right:14px}
  .side button{width:34px;height:34px}
  .side button svg{width:17px;height:17px}
  #vol{width:74px}
  @media (max-width:640px){
    .side.l #shuffle{display:none}
    #vol{display:none}
    .btns{gap:2px}
  }

  /* ---- overlays ---- */
  #boot{
    position:fixed; inset:0; z-index:6;
    display:grid; place-items:center;
    background:rgba(8,8,10,.72);
    backdrop-filter:blur(6px);
    transition:opacity .35s ease;
  }
  #boot.gone{opacity:0; pointer-events:none}
  #boot>div{width:min(420px, calc(100vw - 44px)); text-align:center}
  #bootbtn{
    width:auto; height:auto; gap:12px;
    display:inline-flex; align-items:center;
    padding:16px 30px 16px 22px; border-radius:99px;
    background:#fff; color:#111; font:600 16px/1 inherit;
  }
  #bootbtn:hover{background:#fff;transform:scale(1.03)}
  #bootbtn svg{width:22px;height:22px}
  #boothint{margin-top:18px;font-size:13px;color:var(--dim);text-align:center}

  #toast{
    position:fixed; z-index:7; left:50%; top:24px; transform:translate(-50%,-260%);
    padding:10px 16px; border-radius:99px;
    background:rgba(20,20,22,.9); border:1px solid var(--stroke);
    font-size:13px; transition:transform .28s cubic-bezier(.2,.9,.3,1);
    max-width:calc(100vw - 32px); text-align:center;
  }
  #toast.show{transform:translate(-50%,0)}
  .spin{animation:sp 1s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div id="stage"><div id="yt"></div></div>
<div id="art"></div>
<div id="scrim"></div>

<div id="now">
  <div id="idx">Loading playlist</div>
  <h1 id="title">—</h1>
  <div id="author"></div>
</div>

<div id="bar">
  <div class="seekrow">
    <span class="t" id="cur">0:00</span>
    <input id="seek" type="range" min="0" max="1000" value="0" step="1" aria-label="Seek">
    <span class="t" id="dur">0:00</span>
  </div>

  <div class="btns">
    <button id="prev" title="Previous track (P)" aria-label="Previous track">
      <svg viewBox="0 0 24 24"><path d="M7 6h2v12H7zm3.5 6L19 6v12z"/></svg>
    </button>
    <button id="back" title="Back 10s (←)" aria-label="Back 10 seconds">
      <svg viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7a6 6 0 1 1-6 6H4a8 8 0 1 0 8-8z"/><text x="12.5" y="16" font-size="7" font-weight="700" text-anchor="middle" fill="currentColor" stroke="none">10</text></svg>
    </button>
    <button id="play" title="Play / pause (Space)" aria-label="Play">
      <svg id="playicon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
    </button>
    <button id="fwd" title="Forward 10s (→)" aria-label="Forward 10 seconds">
      <svg viewBox="0 0 24 24"><path d="M12 5V1l5 5-5 5V7a6 6 0 1 0 6 6h2a8 8 0 1 1-8-8z"/><text x="11.5" y="16" font-size="7" font-weight="700" text-anchor="middle" fill="currentColor" stroke="none">10</text></svg>
    </button>
    <button id="next" title="Next track (N)" aria-label="Next track">
      <svg viewBox="0 0 24 24"><path d="M15 6h2v12h-2zM5 6l8.5 6L5 18z"/></svg>
    </button>
  </div>

  <div class="side l">
    <button id="shuffle" title="Shuffle" aria-label="Shuffle">
      <svg viewBox="0 0 24 24"><path d="M14.8 5.5 16.3 7H14l-2.2 3.1 1.2 1.7L14.6 10h1.7l-1.5 1.5 3-3zM4 7h3.2l1.5 2.1 1.2-1.7L8 5.5H4zm10.8 11.5 3-3-3-3 1.5 1.5H14.6l-6 8.4H4v-2h3.4l6-8.4h2.9z"/></svg>
    </button>
    <button id="loop" title="Loop playlist" aria-label="Loop playlist">
      <svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2z"/></svg>
    </button>
  </div>

  <div class="side r">
    <button id="mute" title="Mute / unmute (M)" aria-label="Mute">
      <svg id="volicon" viewBox="0 0 24 24"><path d="M3 10v4h3l4 4V6L6 10zm10.5-1.3a4 4 0 0 1 0 6.6v-1.8a2.3 2.3 0 0 0 0-3zm0-3.4a7.2 7.2 0 0 1 0 13.4v-1.8a5.4 5.4 0 0 0 0-9.8z"/></svg>
    </button>
    <input id="vol" type="range" min="0" max="100" value="100" aria-label="Volume">
    <button id="reroll" title="New background image" aria-label="New background image">
      <svg viewBox="0 0 24 24"><path d="M20 5H4a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2m0 12H4l4-5 2.5 3L14 11z"/><circle cx="8" cy="9.5" r="1.4"/></svg>
    </button>
  </div>
</div>

<div id="boot">
  <div style="text-align:center">
    <button id="bootbtn">
      <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      Start playlist
    </button>
    <div id="boothint">Browsers block autoplay with sound — one tap to begin</div>
  </div>
</div>

<div id="toast"></div>

<script>
/* ------------------------------------------------------------------ config */
const q = new URLSearchParams(location.search);
// override with ?list=<playlistId>&v=<videoId>
const LIST  = q.get('list') || 'PLUPF7M1vfk9Y';
const START = q.get('v')    || 'BNARONXQjYc';
const STEP  = 10; // seek step, seconds

/* ------------------------------------------------------------------- utils */
const $ = id => document.getElementById(id);
const clamp = (n,a,b) => Math.min(b, Math.max(a,n));
const fmt = s => {
  if (!isFinite(s) || s < 0) s = 0;
  s = Math.floor(s);
  const h = Math.floor(s/3600), m = Math.floor(s%3600/60), x = s%60;
  return h ? `${h}:${String(m).padStart(2,'0')}:${String(x).padStart(2,'0')}`
           : `${m}:${String(x).padStart(2,'0')}`;
};
let toastT;
function toast(msg){
  const el = $('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastT);
  toastT = setTimeout(() => el.classList.remove('show'), 2200);
}

/* ------------------------------------------------- full-bleed random image */
function reroll(){
  const seed = Math.random().toString(36).slice(2, 10);
  const w = Math.min(1920, Math.ceil(innerWidth  * (devicePixelRatio || 1)));
  const h = Math.min(1200, Math.ceil(innerHeight * (devicePixelRatio || 1)));
  const url = `https://picsum.photos/seed/${seed}/${w}/${h}`;
  const img = new Image();
  img.onload = () => {
    const art = $('art');
    art.style.backgroundImage = `url("${url}")`;
    art.classList.add('on');
  };
  img.onerror = () => {
    const a = Math.floor(Math.random()*360), b = (a + 60 + Math.random()*120) % 360;
    $('art').style.background =
      `linear-gradient(${Math.floor(Math.random()*360)}deg, hsl(${a} 45% 22%), hsl(${b} 55% 12%))`;
    $('art').classList.add('on');
  };
  img.src = url;
}
reroll();

/* -------------------------------------------------------- youtube iframe api */
let player, ready = false, playing = false, dragging = false, muted = false;
let shuffled = false, looping = true;

window.onYouTubeIframeAPIReady = () => {
  const vars = {
    listType: 'playlist',
    list: LIST,
    controls: 0,
    disablekb: 1,
    modestbranding: 1,
    rel: 0,
    iv_load_policy: 3,
    playsinline: 1
  };
  // only send origin when there is a real one (file:// gives "null")
  if (location.origin && location.origin !== 'null') vars.origin = location.origin;

  player = new YT.Player('yt', {
    playerVars: vars,
    events: { onReady, onStateChange, onError }
  });
};

function onReady(){
  ready = true;
  player.setLoop(true);          // loop the playlist by default
  player.setVolume(+$('vol').value);
  // jump to the video from the shared URL, if it's in this playlist
  const list = player.getPlaylist() || [];
  const i = list.indexOf(START);
  if (i > 0) player.playVideoAt(i);
  paint();
}

function onStateChange(e){
  const S = YT.PlayerState;
  playing = e.data === S.PLAYING;
  setPlayIcon(playing, e.data === S.BUFFERING);
  if (e.data === S.PLAYING || e.data === S.PAUSED || e.data === S.CUED) paint();
  if (e.data === S.ENDED && !looping) setPlayIcon(false, false);
}

function onError(e){
  const map = {
    2:'Bad video or playlist ID', 5:'Playback error in this browser',
    100:'Video removed or private', 101:'Embedding disabled for this video',
    150:'Embedding disabled for this video'
  };
  toast(map[e.data] || `Player error ${e.data}`);
  if (e.data === 101 || e.data === 150 || e.data === 100) setTimeout(() => safe(()=>player.nextVideo()), 1200);
}

const safe = fn => { if (ready) try { fn(); } catch(err) { console.warn(err); } };

/* ---------------------------------------------------------------- painting */
function setPlayIcon(isPlaying, isBuffering){
  const svg = $('playicon');
  svg.parentElement.classList.toggle('spin', false);
  svg.innerHTML = isBuffering
    ? '<path d="M12 4V1L8 5l4 4V6a6 6 0 1 1-6 6H4a8 8 0 1 0 8-8z" opacity=".9"/>'
    : isPlaying
      ? '<path d="M6 5h4v14H6zm8 0h4v14h-4z"/>'
      : '<path d="M8 5v14l11-7z"/>';
  if (isBuffering) svg.classList.add('spin'); else svg.classList.remove('spin');
  $('play').setAttribute('aria-label', isPlaying ? 'Pause' : 'Play');
}

function paint(){
  if (!ready) return;
  const d = player.getVideoData ? player.getVideoData() : null;
  if (d && d.title){
    $('title').textContent  = d.title;
    $('author').textContent = d.author || '';
  }
  const list = player.getPlaylist() || [];
  const i = player.getPlaylistIndex();
  $('idx').textContent = list.length
    ? `Track ${i + 1} of ${list.length}`
    : 'Playlist';
  $('prev').disabled = !list.length;
  $('next').disabled = !list.length;
}

function tick(){
  if (ready && !dragging){
    const t = player.getCurrentTime() || 0;
    const d = player.getDuration()    || 0;
    $('cur').textContent = fmt(t);
    $('dur').textContent = fmt(d);
    const pct = d ? (t / d) * 1000 : 0;
    $('seek').value = pct;
    $('seek').style.setProperty('--p', (pct / 10) + '%');
  }
  requestAnimationFrame(() => setTimeout(tick, 200));
}
tick();

/* ---------------------------------------------------------------- controls */
$('bootbtn').onclick = () => {
  $('boot').classList.add('gone');
  safe(() => { player.unMute(); player.playVideo(); });
  if (!ready) toast('Still loading the player…');
};

$('play').onclick = () => safe(() => playing ? player.pauseVideo() : player.playVideo());
$('back').onclick = () => nudge(-STEP);
$('fwd').onclick  = () => nudge(+STEP);
$('prev').onclick = () => safe(() => { player.previousVideo(); setTimeout(paint, 700); });
$('next').onclick = () => safe(() => { player.nextVideo();     setTimeout(paint, 700); });

function nudge(delta){
  safe(() => {
    const d = player.getDuration() || 0;
    const t = clamp((player.getCurrentTime() || 0) + delta, 0, d ? d - 0.3 : 0);
    player.seekTo(t, true);
    $('cur').textContent = fmt(t);
    toast(`${delta > 0 ? '+' : '−'}${Math.abs(delta)}s`);
  });
}

const seek = $('seek');
const beginDrag = () => { dragging = true; };
const endDrag = () => {
  if (!dragging) return;
  dragging = false;
  safe(() => {
    const d = player.getDuration() || 0;
    player.seekTo((seek.value / 1000) * d, true);
  });
};
seek.addEventListener('pointerdown', beginDrag);
seek.addEventListener('pointerup', endDrag);
seek.addEventListener('pointercancel', endDrag);
seek.addEventListener('keydown', beginDrag);
seek.addEventListener('keyup', endDrag);
seek.addEventListener('input', () => {
  seek.style.setProperty('--p', (seek.value / 10) + '%');
  if (ready) $('cur').textContent = fmt((seek.value / 1000) * (player.getDuration() || 0));
});

$('mute').onclick = () => safe(() => {
  muted = !player.isMuted();
  muted ? player.mute() : player.unMute();
  paintVol();
});

const vol = $('vol');
vol.style.setProperty('--p', '100%');
vol.addEventListener('input', () => safe(() => {
  player.setVolume(+vol.value);
  if (+vol.value > 0 && player.isMuted()) player.unMute();
  paintVol();
}));

function paintVol(){
  const m = ready ? player.isMuted() : false;
  const v = ready ? (player.getVolume() || 0) : +vol.value;
  muted = m;
  vol.value = m ? 0 : v;
  vol.style.setProperty('--p', (m ? 0 : v) + '%');
  $('volicon').innerHTML = m || v === 0
    ? '<path d="M3 10v4h3l4 4V6L6 10zm16.5 1.3-1.4-1.4-1.8 1.8-1.8-1.8-1.4 1.4L14.9 13l-1.8 1.8 1.4 1.4 1.8-1.8 1.8 1.8 1.4-1.4L17.7 13z"/>'
    : v < 50
      ? '<path d="M3 10v4h3l4 4V6L6 10zm10.5-1.3a4 4 0 0 1 0 6.6v-1.8a2.3 2.3 0 0 0 0-3z"/>'
      : '<path d="M3 10v4h3l4 4V6L6 10zm10.5-1.3a4 4 0 0 1 0 6.6v-1.8a2.3 2.3 0 0 0 0-3zm0-3.4a7.2 7.2 0 0 1 0 13.4v-1.8a5.4 5.4 0 0 0 0-9.8z"/>';
  $('mute').classList.toggle('on', m);
}

$('shuffle').onclick = () => safe(() => {
  shuffled = !shuffled;
  player.setShuffle(shuffled);
  $('shuffle').classList.toggle('on', shuffled);
  toast(shuffled ? 'Shuffle on' : 'Shuffle off');
  setTimeout(paint, 400);
});

$('loop').onclick = () => safe(() => {
  looping = !looping;
  player.setLoop(looping);
  $('loop').classList.toggle('on', looping);
  toast(looping ? 'Loop playlist on' : 'Loop playlist off');
});
$('loop').classList.add('on');

$('reroll').onclick = reroll;

/* -------------------------------------------------------------- keyboard */
addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' && e.key !== ' ') return;
  const k = e.key.toLowerCase();
  const hit = {
    ' ':      () => $('play').click(),
    k:        () => $('play').click(),
    arrowleft:  () => nudge(-STEP),
    arrowright: () => nudge(+STEP),
    j:        () => nudge(-STEP),
    l:        () => nudge(+STEP),
    n:        () => $('next').click(),
    p:        () => $('prev').click(),
    m:        () => $('mute').click(),
    s:        () => $('shuffle').click(),
    r:        () => reroll(),
    arrowup:  () => bumpVol(+5),
    arrowdown:() => bumpVol(-5)
  }[k];
  if (hit){ e.preventDefault(); hit(); }
});
function bumpVol(d){
  safe(() => {
    const v = clamp((player.getVolume() || 0) + d, 0, 100);
    player.setVolume(v);
    if (v > 0) player.unMute();
    paintVol();
    toast(`Volume ${Math.round(v)}%`);
  });
}

/* --------------------------------------------------------------- api load */
const s = document.createElement('script');
s.src = 'https://www.youtube.com/iframe_api';
s.onerror = () => toast('Could not load the YouTube player API');
document.head.appendChild(s);
</script>
</body>
</html>
